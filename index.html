<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>彩 / Irodori</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b0d14; color: #e6e9f0;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    /* iPad: ダブルタップ・ピンチでページが拡大されないように（canvas 以外＝バーの上でも） */
    touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none;
  }
  /* canvas は置換要素。inset:0 だけでは固有サイズのままなので 100% を明示する */
  #paint { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  #bar {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 999px;
    background: rgba(18, 22, 34, .72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 30px rgba(0,0,0,.35);
    transition: opacity .6s ease;
  }
  #bar.quiet { opacity: .18; }
  #bar:hover { opacity: 1; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex: none; }
  .sw.on { border-color: #fff; transform: scale(1.14); }
  .sep { width: 1px; height: 22px; background: rgba(255,255,255,.14); margin: 0 2px; }
  button {
    font: inherit; font-size: 13px; color: #e6e9f0; cursor: pointer;
    background: rgba(255,255,255,.08); border: 0; border-radius: 999px; padding: 8px 12px;
  }
  button:hover { background: rgba(255,255,255,.16); }
  #bar button { white-space: nowrap; flex: none; }   /* ボタンが増えても、文字を縦に折り返さない */
  #status {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .04em; color: #9aa3b5;
    background: rgba(18,22,34,.6); padding: 6px 12px; border-radius: 999px;
    transition: opacity 1s ease; pointer-events: none;
  }
  #hint {
    position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px); transform: translateX(-50%);
    max-width: calc(100vw - 32px); text-align: center; font-size: 15px; letter-spacing: .04em; line-height: 1.7;
    color: #e6e9f0; background: rgba(18,22,34,.62); padding: 8px 16px; border-radius: 16px; pointer-events: none;
  }
  #credit { position: fixed; left: 12px; bottom: max(8px, env(safe-area-inset-bottom)); font-size: 10px; color: rgba(200,208,225,.45); pointer-events: none; }
  @media (max-width: 600px) { #credit { bottom: auto; top: max(44px, env(safe-area-inset-top)); } }
  #talk {
    position: fixed; left: 0; top: 0; transform: translate(-50%, -100%);
    max-width: min(320px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 18px;
    background: rgba(250,248,255,.94); color: #2a2440; font-size: 17px; line-height: 1.6; letter-spacing: .04em;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); pointer-events: none; white-space: pre-wrap;
  }
  #talk::after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -9px; margin-left: -9px; border: 9px solid transparent; border-top-color: rgba(250,248,255,.94); border-bottom: 0; }
  #blocks { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; display: flex; gap: 6px; }
  .chip { font-size: 11px; padding: 4px 9px; border-radius: 999px; background: rgba(120,200,170,.18); color: #bfe8d6; cursor: pointer; }
  #debug-panel {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px;
    width: min(390px, calc(100vw - 48px)); max-height: 46vh; overflow: auto;
    padding: 10px 12px; border-radius: 12px; background: rgba(12,16,26,.84);
    color: #dbe3ef; font: 11px/1.5 ui-monospace, monospace;
    user-select: text; -webkit-user-select: text; touch-action: pan-y;
  }
  #debug-panel summary { cursor: pointer; font-size: 12px; }
  #debug-panel p { margin: 8px 0; }
  #debug-panel pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
  #debug-panel button { font-size: 11px; padding: 6px 10px; }
  @media (max-width: 600px) {
    #bar {
      box-sizing: border-box; width: min(340px, calc(100vw - 24px));
      flex-wrap: wrap; justify-content: center; border-radius: 24px;
    }
    #palette { flex-basis: 100%; justify-content: center; }
    #bar .sep { display: none; }
    #bar button { flex: none; white-space: nowrap; }
  }
</style>
</head>
<body>
<canvas id="paint"></canvas>
<div id="status">ゆびで えがく</div>
<div id="blocks"></div>
<div id="hint" hidden></div>
<div id="credit" hidden>効果音：OtoLogic（CC BY 4.0）</div>
<div id="talk" hidden><span id="talk-text"></span></div>
<div id="bar">
  <div id="palette" style="display:flex;gap:8px"></div>
  <div class="sep"></div>
  <button id="mesh">MESHをつなぐ</button>
  <button id="mic">こえ</button>
  <button id="clear">けす</button>
  <button id="game">あそぶ</button>
  <button id="sound">おと</button>
</div>

<script>
(() => {
  'use strict';

  // ────────────────────────────────────────────────────────────
  // 彩 / Irodori — MESH で自由に絵を描く拡張
  //
  //   指（マウス・ペン）で、自由に描く。これが土台。
  //   MESH ブロックは、その筆とパレットを拡張する。
  //
  //   動きブロック  上を向いた面（1〜6）＝ 6色のパレット
  //                振る ＝ 花火 / 叩く ＝ 星 / ひっくり返す ＝ そっと消える
  //   ボタン       1回 ＝ 花火 / 2回 ＝ 次の色 / 長押し ＝ 消す
  //   明るさ       手をかざす ＝ 筆が太くなる
  //   こえ         声の大きさ ＝ 筆の光 / 大きな声 ＝ 花火
  //
  // 描くたびに部屋が少しずつ明るくなる（暗い雰囲気をとる）。
  //
  // BLE の通信形式は Sony 公式の MESH 通信仕様（developer.meshprj.com）に基づく。
  // ※ 実機との接続はまだエンドツーエンドで検証していない。
  // ────────────────────────────────────────────────────────────

  const cv = document.getElementById('paint');
  const ctx = cv.getContext('2d');
  const statusEl = document.getElementById('status');
  const barEl = document.getElementById('bar');
  const blocksEl = document.getElementById('blocks');
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  let reducedMotion = motionPreference.matches;
  motionPreference.addEventListener('change', event => { reducedMotion = event.matches; });

  // ── パレット（動きブロックの6面に1色ずつ対応）───────────────
  const PALETTE = [
    { name: 'あか',   h: 352 },  // 1面
    { name: 'だいだい', h: 28 },  // 2面
    { name: 'きいろ', h: 50 },   // 3面
    { name: 'みどり', h: 140 },  // 4面
    { name: 'あお',   h: 205 },  // 5面
    { name: 'むらさき', h: 280 }, // 6面
  ];
  let colorIndex = 4;
  const hsl = (h, s = 88, l = 64, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

  const paletteEl = document.getElementById('palette');
  PALETTE.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'sw'; d.style.background = hsl(c.h);
    d.title = c.name;
    d.onclick = () => setColor(i, 'パレット');
    paletteEl.appendChild(d);
  });
  function setColor(i, via) {
    colorIndex = ((i % PALETTE.length) + PALETTE.length) % PALETTE.length;
    [...paletteEl.children].forEach((el, k) => el.classList.toggle('on', k === colorIndex));
    say(`${PALETTE[colorIndex].name}${via ? '（' + via + '）' : ''}`);
  }

  // ── 表示 ────────────────────────────────────────────────
  let W = 0, H = 0, DPR = 1;
  const ink = document.createElement('canvas');   // 描いたものが溜まる層（消さない）
  const inkCtx = ink.getContext('2d');

  // ink は「画面の長辺×長辺」の正方形で持ち、縮めない・引き伸ばさない。
  // 画面には左上から画面ぶんだけを等倍で写す（frame の blit）。
  // → iPad を回しても、ウィンドウを全画面にしても、絵は歪まず、はみ出た分も消えない。
  function resize() {
    const nw = cv.clientWidth, nh = cv.clientHeight;
    if (!nw || !nh) return;                            // 0サイズの瞬間は触らない（絵を失わない）
    const nd = Math.min(window.devicePixelRatio || 1, 2);
    W = nw; H = nh;
    cv.width = Math.floor(W * nd); cv.height = Math.floor(H * nd);
    ctx.setTransform(nd, 0, 0, nd, 0, 0);

    const need = Math.ceil(Math.max(W, H) * nd);
    const kept = ink.width ? Math.ceil(ink.width / DPR * nd) : 0;   // いまの絵を新しい DPR で測った一辺
    const side = Math.max(need, kept);
    if (side !== ink.width || nd !== DPR) {
      let keep = null;
      if (ink.width) {
        keep = document.createElement('canvas');
        keep.width = ink.width; keep.height = ink.height;
        keep.getContext('2d').drawImage(ink, 0, 0);
      }
      ink.width = ink.height = side;
      inkCtx.setTransform(1, 0, 0, 1, 0, 0);
      if (keep) {
        const s = nd / DPR;                              // 縦横同じ倍率（DPR が変わった時だけ 1 以外）
        inkCtx.drawImage(keep, 0, 0, keep.width * s, keep.height * s);
        keep.width = keep.height = 0;                    // Safari は canvas のメモリ解放が遅いので即返す
      }
    }
    DPR = nd;
    inkCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  if ('ResizeObserver' in window) new ResizeObserver(() => {
    if (cv.clientWidth !== W || cv.clientHeight !== H) resize();
  }).observe(cv);

  let statusTimer = null;
  let onSay = null;              // 診断時だけ、消えてしまうメッセージを残す
  function say(msg) {
    statusEl.textContent = msg; statusEl.style.opacity = 1;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { statusEl.style.opacity = .0; }, 2600);
    if (onSay) onSay(msg);
  }

  // ── 部屋の明るさ：描くほど暗さがとれていく ──────────────────
  let warmth = 0, displayedWarmth = 0;   // 0..1
  function brighten(amount) { warmth = Math.min(1, warmth + amount * (reducedMotion ? 0.35 : 1)); }

  // 置きっぱなし展示：誰も触らない時間が続いたら、ゆっくり夜に戻して次の人を迎える
  const IDLE_COOL_MS = 20 * 1000, IDLE_CLEAR_MS = 3 * 60 * 1000;
  let lastInput = performance.now(), idleCleared = false;
  const poke = () => { lastInput = performance.now(); idleCleared = false; };
  ['pointerdown', 'pointermove', 'keydown'].forEach((t) =>
    window.addEventListener(t, poke, { capture: true, passive: true }));
  setInterval(() => {
    const idle = performance.now() - lastInput;
    if (idle > IDLE_COOL_MS) warmth = Math.max(0, warmth - 0.004);          // 1秒ごと。1→0 に約4分
    if (idle > IDLE_CLEAR_MS && !idleCleared) { idleCleared = true; softClear(); }
  }, 1000);

  // ── 筆 ──────────────────────────────────────────────────
  let brushBase = 7;          // 明るさブロックで太くなる（毎フレーム brushTarget へなめらかに寄せる）
  let brushTarget = 7;
  let voiceGlow = 0;          // 声で光が強くなる（0..1）
  let last = null;

  // ── 明るさブロック：ためて、放つ ─────────────────────────
  // 手を近づける＝光がたまる（輪が大きく明るくなる）・筆が太く光る / 手を離す＝ためた分だけ花火
  // 近接値の出方は手・距離・部屋の明るさで変わるので、固定の値ではなく「これまでの最大の4割」を近いとみなす
  const HAND_MIN_MS = 250, HAND_FULL_MS = 2500, HAND_MIN_LIFT = 80;
  // 手の操作の見分け方（2026-09-13 の実機記録 64 回から）：長さ 0.25 秒未満＝ちょん / 0.7 秒未満＝短め / 2.5 秒未満＝長め / それ以上＝握る
  // 離す速さ：ピークの 8 割から離れたと判定するまで 0.15 秒以内＝パッ、それより遅い＝そっと（記録ではほぼ 0.06〜0.3 秒と 0.5 秒以上に分かれた）
  // じっと止める：手の近さのゆらぎが小さいまま STILL_MS 続く（?still=秒 で変えられる。標準 12 秒）
  const STILL_MS = (() => { const v = Number(new URLSearchParams(location.search).get('still')); return v > 0 ? v * 1000 : 12000; })();
  let evtPeak = 0, evtStrongAt = 0, stillMean = 0, stillVar = 0, stillSince = 0, sleeping = false, lastGesture = null, pressSounded = false, umu = 0;
  let handLift = 0, handPeak = 0, handSeenAt = -1e9, handNearAt = 0, handGlow = 0;
  let auraX = null, auraY = null;          // 光の輪の場所（最後に描いた点。まだ描いていなければ画面の中央）
  const handLine = () => Math.max(HAND_MIN_LIFT, handPeak * 0.4);
  const handCharge = (now) => (handNearAt ? Math.min(1, (now - handNearAt) / HAND_FULL_MS) : 0);
  function handGesture(lift, now) {
    const dt = Math.min(2000, now - handSeenAt);
    handPeak = Math.max(lift, handPeak * Math.exp(-Math.min(60000, dt) / 60000));   // 最大は1分ほどで忘れていく
    handSeenAt = now; handLift = lift;
    const line = handLine();
    if (!handNearAt && lift > line) {
      handNearAt = now; evtPeak = lift; evtStrongAt = now; stillMean = lift; stillVar = 0; stillSince = now; pressSounded = false; umu = 0;   // 眠りは、離したときに起こす（通知の途切れでは起こさない）
    } else if (handNearAt && lift < line * 0.6) {
      handRelease(now);                           // 離す側は低めに見て、境目の揺れで何度も咲かせない
    } else if (handNearAt) {
      if (lift > evtPeak) evtPeak = lift;
      if (lift >= evtPeak * 0.8) evtStrongAt = now;
      const a = 1 - Math.exp(-dt / 1500), diff = lift - stillMean;   // 約 1.5 秒の窓で、近さの平均とゆらぎを追う
      stillMean += a * diff; stillVar = (1 - a) * (stillVar + a * diff * diff);
      if (Math.sqrt(stillVar) / Math.max(1, stillMean) > 0.2) stillSince = now;   // 動いたら、じっとの時計を戻す
    }
    if (handNearAt) poke();
  }
  function handRelease(now) {
    const held = now - handNearAt, charge = handCharge(now), releaseMs = now - evtStrongAt, wasSleeping = sleeping;
    handNearAt = 0; sleeping = false;
    if ((game.on || mochiActive) && held < 100 && !wasSleeping) return;   // 0.1 秒未満は、手がかすめただけとみなす（実機の記録で意図しない反応が出た）
    const kind = wasSleeping ? 'wake' : held < 250 ? 'tap' : held < 700 ? 'short' : held < 2500 ? 'long' : 'grip';
    lastGesture = { kind, heldMs: Math.round(held), releaseMs: Math.round(releaseMs), fast: releaseMs <= 150 };
    if (game.on) { gameRelease(lastGesture, held); return; }
    if (mochiActive) { mochiGesture(lastGesture, charge); return; }
    if (held < HAND_MIN_MS) return;                // 一瞬の揺れは無視
    const x = auraX ?? undefined, y = auraY ?? undefined, hue = PALETTE[colorIndex].h;
    firework(x, y, hue, charge >= 0.6);
    if (charge >= 1) setTimeout(() => firework(x, y, hue + 40, true), 180);   // いっぱいまでためたら、二重に咲く
    markUsed('PA');
  }
  function resetHand() { handNearAt = 0; handLift = 0; sleeping = false; brushTarget = 7; }

  // ── もち：明るさブロックで押して、飛ばす ────────────────────
  // 実機の明るさブロックは近接の値を 1 秒に約 20 回送ってくる（2026-09-13 の記録）。その連続値で、もちを押しつぶす。
  // 手を近づける＝むにっと潰れる / 離す＝ぷるんと伸びて、ためた分だけ小さなもちを飛ばす / 飛んだもちは色のしみとして絵に残る
  const mochiParam = new URLSearchParams(location.search).get('mochi');
  let mochiActive = mochiParam === '1';
  let mochiBeforeGame = false;
  // さいしょの あいさつ：画面を開くと、もちが真ん中に大きく出てきて、ひらがなで話す。触るかキーで飛ばせる。
  // 自動テストのブラウザ（navigator.webdriver）では出さない。?intro=1 で必ず出す、?intro=0 で出さない
  const introParam = new URLSearchParams(location.search).get('intro');
  const intro = { on: introParam === '1' || (introParam !== '0' && !navigator.webdriver && mochiParam !== '0'), phase: 'wait', t0: 0, shrinkAt: 0, p: 0 };
  // ブラウザは、一度も触っていない画面では音を鳴らせない。なので最初は「さわってね」と待ち、触ったら声と一緒に話し始める
  if (intro.on) mochiActive = true;          // 声の素材は、触る前に読み込んでおく（読み込みは音を鳴らさなくてもできる）
  let touchPress = null;                           // 指で もちを押しているとき { id, at }          // 明るさブロックがつながったら出す（?mochi=1 でブロックなしでも出す、?mochi=0 で出さない）
  const mochi = { s: 0, v: 0, x: 0, y: 0, r: 40, jy: 0, jv: 0, jg: 0.55, jfloat: 1, apex: 0, cy: 0, blinkAt: 0, thrown: 0, splats: 0, gestures: { tap: 0, short: 0, long: 0, grip: 0, still: 0, wake: 0 } };
  const GESTURE_NAME = { tap: 'ちょん', short: 'ぽん', long: 'ぽーん', grip: 'ぎゅっ', wake: 'おはよう' };

  // 手の操作ごとの反応：ちょん＝はねる / 短め＝2つ / 長め＝4つ / 握る＝7つと花火 / じっと＝眠って夜が明け、離すと起きて虹色に飛ばす
  // パッと離す＝速く高く飛ぶ、そっと離す＝ふわっと遅く落ちる
  function mochiGesture(g, charge) {
    mochi.gestures[g.kind]++;
    talkOnRelease(g.kind);
    say(g.kind === 'wake' ? 'おはよう' : `${GESTURE_NAME[g.kind]}（${g.fast ? 'パッ' : 'そっと'}）`);
    markUsed('PA');
    if (g.kind === 'tap') { mochi.jv = -7; mochi.v -= 0.1; sound('hop'); return; }
    const count = { short: 2, long: 4, grip: 7, wake: 9 }[g.kind];
    mochiThrow(count, g.fast, g.kind === 'wake');
    if (g.kind === 'grip') { firework(mochi.x, mochi.y - mochi.r * 0.5, PALETTE[colorIndex].h, true); sound('surprise'); }
    if (g.kind === 'wake') { mochi.jv = -13; brighten(0.12); sound('dawn'); firework(W * 0.3, H * 0.3, 35, true); firework(W * 0.7, H * 0.28, 50, true); }
  }
  function mochiSleep() {
    sleeping = true; mochi.gestures.still++;
    say('すやすや…（はなすと おきる）');
    speak('すや… すや…', true);
  }

  // ── もちが話す：遊び方を、もち自身が少しずつ教える。文字は勝手に流れ、押している間はゆっくり話す ──
  const talkEl = document.getElementById('talk'), talkText = document.getElementById('talk-text');
  const talk = { queue: [], line: '', shown: 0, nextCharAt: 0, doneAt: 0, holdUntil: 0, step: 0, lastSpokeAt: 0, idle: 0, lines: 0 };
  const TALK_IDLE = ['じっと していると、ねむく なる…', 'そっと はなすと、ふわっと とぶよ', 'ながく おすと、びっくり するよ', 'ちょんと さわると、はねるよ'];
  function speak(text, interrupt = false) {
    if (interrupt) { talk.queue.length = 0; if (talk.line !== text) talk.line = ''; talk.holdUntil = 0; }
    if (talk.line === text || talk.queue.includes(text)) return;
    talk.queue.push(text);
  }
  function stepTalk(nowMs) {
    if (intro.on && intro.phase === 'wait') {       // 触られるまで「さわってね」
      if (!talk.line && !talk.queue.length) speak('さわってね。');
      talk.step = 0.25;
    } else if (talk.step === 0) {                   // もちが出たら、あいさつから（ゲームから始めたら、ゲームの話だけ）
      talk.step = game.on ? 4 : 1;
      speak('こんばんは。ぼく、もち。');
      speak(game.on ? 'ためて、はなすと ジャンプ。てんせんが とぶ たかさ だよ。' : 'ぼくを おしてみて。ゆびでも いいよ。');
    }
    if (talk.step === 0.5 && !talk.line && !talk.queue.length && intro.phase === 'show') endIntro(nowMs);
    if (!talk.line && talk.queue.length && nowMs >= talk.holdUntil) {
      talk.line = talk.queue.shift(); talk.shown = 0; talk.nextCharAt = nowMs; talk.doneAt = 0; talk.lines++;
    }
    if (talk.line) {
      const slow = handNearAt || game.pressAt || touchPress;   // 押している間は、ゆっくり話す
      let typed = '';
      while (talk.shown < talk.line.length && nowMs >= talk.nextCharAt) { typed = talk.line[talk.shown]; talk.shown++; talk.nextCharAt += slow ? 190 : 60; }
      if (typed) talkBlip(typed, slow, talk.line[talk.shown - 2]);
      if (talkText.textContent.length !== talk.shown) talkText.textContent = talk.line.slice(0, talk.shown);
      if (talk.shown >= talk.line.length && !talk.doneAt) talk.doneAt = nowMs;

  function spawnStar(x, y, vx, shooting = false) {

  function toggleMute() {                          // 画面の「おと」ボタンと M キー

  function toggleGame() {

  function stepGame(k, now) {
    if (now > game.nextAt) { if (game.stars.length < 8) spawnStar(undefined, undefined, undefined, !sleeping && Math.random() < 0.1); game.nextAt = now + (sleeping ? 2600 : 1300 + Math.random() * 1000); }   // 画面の星は 8 個まで

  }

  // 星を取る。もちが空中で続けて取るか、ロケットが通り道で集めると「れんさ」になり、取った星どうしが夜空で線につながる（星座）

    game.flyers.push({ x: st.x, y: st.y, tx, ty, r: st.r * 0.6, hue: st.hue, p: 0, link: linked && chain.length ? chain[chain.length - 1] : null });
    if (linked) chain.push({ x: tx, y: ty });
    if (now - game.kiranAt > 70) { game.kiranAt = now; sound('combo', combo); }   // 同時に取っても音は重ねない
    brighten(0.012 * st.value);
    const gain = st.value + Math.min(4, combo - 1);   // れんさ 1 回ごとに +1 点（最大 +4）
    if (st.shooting) { game.shootings++; say('ながれぼし！'); speak('ながれぼし！ +5', true); }

  }

  // ── ロケット：ボタンブロックの 1 回押し（R キーでも）。もちの横から発射して、上で花火になる ──
  // ゲーム中は通り道の星を集め、絵のときは飛んだ跡を光る線で残す。同時に 3 本まで、0.8 秒に 1 本まで。

    const y = mochiActive ? groundY() - 10 : H - 90;
    rockets.push({ x, y, vx: (Math.random() - 0.5) * 0.3, vy: -0.6, t: 0, hue: PALETTE[colorIndex].h, chain: [], caught: 0, lastX: x, lastY: y });

  function stepRockets(k, now) {

  function drawRockets() {

  function addScore(gain, now) {

  function flyerPos(f) {

  function stampStar(f) {                           // 夜空に小さな星として残す。れんさなら、前の星と線でつなぐ

  function starPath(c, x, y, r, rot) {

  }
  function drawGame(now) {
    const fs = (px) => Math.round(px * Math.max(1, (mochi.r || 40) / 70));   // プロジェクターの大きな画面でも読める大きさ
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const d of game.dust) {                    // 土ぼこり

    }

      ctx.fillStyle = hsl(f.hue, 90, 85, 0.9 - f.p * 0.3);

    ctx.fillText(`★ ${game.score}`, W / 2, 84);      // 上のメッセージ（say）と重ならない高さ

    ctx.fillStyle = 'hsl(35, 90%, 70%)'; ctx.fillRect(W / 2 - 80, 96, 160 * p, 4);
    ctx.textAlign = 'start';
    ctx.restore();
  }

  // ── おと：効果音の素材（下の SFX_DATA）と、ブラウザの中で合成する音。通信はしない。M キーで消す ──
  let audio = null, audioMuted = false, squish = null;

  // 効果音の素材：OtoLogic（https://otologic.jp）の音源を CC BY 4.0 で利用。

    src.connect(g); g.connect(a.master);
    src.onended = () => { src.disconnect(); g.disconnect(); };

  const wobble = (spread = 0.08) => 1 - spread / 2 + Math.random() * spread;   // 同じ音が続いても機械的に聞こえないように

  // 音の部品：柔らかい雑音（1 秒ぶんを 1 回だけ作って使い回す）、音量の山、終わったら外す
  let noiseBuf = null;
  function softNoise(a) {
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      let v = 0, peak = 0;
      for (let i = 0; i < ch.length; i++) { v = 0.96 * v + 0.04 * (Math.random() * 2 - 1); ch[i] = v; peak = Math.max(peak, Math.abs(v)); }
      for (let i = 0; i < ch.length; i++) ch[i] /= peak || 1;

  function envelope(g, t, peak, attack, decay) {
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }
  function voice(a, nodes, first, t, stop) {       // nodes を順につなぎ、最後を master へ。止まったら全部外す
    for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]);
    nodes[nodes.length - 1].connect(a.master);
    first.onended = () => nodes.forEach((n) => n.disconnect());
    first.start(t); first.stop(stop);
  }
  function tone(a, type, t, freqs, peak, attack, decay) {   // freqs: [[時刻のずれ, 周波数], ...]
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freqs[0][1], t);
    for (const [dt, f] of freqs.slice(1)) o.frequency.exponentialRampToValueAtTime(f, t + dt);

  function puff(a, t, type, freq, q, peak, attack, decay) {   // 雑音の短いかたまり（ぷにっ・ぺた）
    const n = softNoise(a), f = a.createBiquadFilter(), g = a.createGain();
    f.type = type; f.frequency.value = freq; f.Q.value = q;

  }
  const note = (amount) => PENTA[Math.max(0, Math.min(PENTA.length - 1, Math.floor((1 - amount) * PENTA.length)))];

  function sound(kind, amount = 0) {
    const a = audioOut(); if (!a) return;
    const t = a.currentTime;
    if (kind === 'boing' && sample(a, amount < 0.4 ? 'jumpHigh' : amount < 0.75 ? 'jumpMid' : 'jumpLow', t, 0.75, wobble())) {
      tone(a, 'sine', t + 0.02, [[0, 150 + amount * 60], [0.35, 110]], 0.08, 0.02, 0.35);   // もちの重さを、低い音で少しだけ足す
    } else if (kind === 'boing') {                  // ぽよん（素材の読み込み前）：「ぷにっ」と立ち上がって、揺れがおさまっていく
      const f = 170 + amount * 120;
      puff(a, t, 'bandpass', 1400, 1.2, 0.28, 0.004, 0.05);
      const body = tone(a, 'sine', t, [[0, f * 0.9], [0.06, f * 2.3], [0.5, f * 1.25]], 0.42, 0.012, 0.55 + amount * 0.25);
      const lfo = a.createOscillator(), depth = a.createGain();
      lfo.frequency.value = 9; depth.gain.setValueAtTime(f * 0.14, t); depth.gain.exponentialRampToValueAtTime(1, t + 0.6);
      lfo.connect(depth); depth.connect(body.frequency);
      lfo.onended = () => { lfo.disconnect(); depth.disconnect(); };
      lfo.start(t); lfo.stop(t + 0.9);
      tone(a, 'triangle', t, [[0, f * 1.8], [0.06, f * 4.6], [0.5, f * 2.5]], 0.07, 0.012, 0.4);
    } else if (kind === 'pop' && sample(a, amount < 0.33 ? 'dropHigh' : amount < 0.66 ? 'dropMid' : 'dropLow', t, 0.8, wobble(0.12))) {
      // ぽっ：画面の上でくっつくほど高い音
    } else if (kind === 'pop') {                    // ぺた（素材の読み込み前）：湿った小さなかたまり＋しみになった高さの音
      puff(a, t, 'lowpass', 650, 0.7, 0.3, 0.003, 0.09);
      tone(a, 'triangle', t + 0.01, [[0, note(amount)]], 0.18, 0.006, 0.24);
    } else if (kind === 'hop' && sample(a, 'bubble', t, 0.7, 1.1 * wobble())) {
      // ぽっ：ちょん・空中でもう一段
    } else if (kind === 'hop') {                    // ぴょん（素材の読み込み前）
      tone(a, 'sine', t, [[0, 480], [0.07, 960], [0.14, 820]], 0.28, 0.006, 0.14);
    } else if (kind === 'kiran' && sample(a, 'star', t, 0.7, 1.25 - amount * 0.4)) {
      // きらっ：高いところの星ほど高く
    } else if (kind === 'kiran') {                  // きらん（素材の読み込み前）：取った高さの音と、その五度上
      const f = note(amount);
      tone(a, 'sine', t, [[0, f * 2]], 0.16, 0.003, 0.5);

    } else if (kind === 'umu') {                    // むむむ：口を閉じたまま、がまんする声（合成）。握るほど高く
      const base = 185 + amount * 45;
      [0, 0.22, 0.44, ...(amount ? [0.62] : [])].forEach((d, i) => {
        const o = a.createOscillator(), lp = a.createBiquadFilter(), g = a.createGain(), vib = a.createOscillator(), vg = a.createGain();

      if (!sample(a, 'star', t, 0.7, steps[Math.max(0, Math.min(steps.length - 1, amount - 1))])) tone(a, 'sine', t, [[0, PENTA[Math.min(PENTA.length - 1, amount - 1)] * 2]], 0.16, 0.003, 0.4);

  }
  function squishSound() {                           // むにゅ：こもった雑音と低い音を、沈んでいく速さのぶんだけ鳴らす
    if (!audio || audio.state !== 'running' || audioMuted) return;   // 毎フレーム呼ばれるので、音が始まるまでは何もしない
    const a = audioOut();
    if (!a) return;

    squish.g.gain.setTargetAtTime(Math.min(0.12, speed * 1.6), t, 0.04);
    squish.bp.frequency.setTargetAtTime(950 - Math.max(0, mochi.s) * 900, t, 0.05);   // 潰れるほど、こもる

  // ── 花火と星（MESH の出来事から咲く）───────────────────────
  const sparks = [];
  function firework(x, y, hue = PALETTE[colorIndex].h, big = false) {
    x = x ?? W * (0.2 + Math.random() * 0.6);
    y = y ?? H * (0.2 + Math.random() * 0.45);
    const n = reducedMotion ? (big ? 50 : 30) : (big ? 150 : 90);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.2;
      const sp = (big ? 5.2 : 3.6) * (0.35 + Math.random() * 0.75) * (reducedMotion ? 0.6 : 1);
      sparks.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.010 + Math.random() * 0.012,
        h: hue + (Math.random() * 40 - 20), size: 1.4 + Math.random() * 2.4, trail: true

    }
    brighten(big ? 0.06 : 0.035);
  }
  function star(x, y) {
    x = x ?? (last ? last.x : W / 2); y = y ?? (last ? last.y : H / 2);
    const c = PALETTE[colorIndex];
    inkCtx.save();
    inkCtx.translate(x, y);
    inkCtx.globalCompositeOperation = 'lighter';
    const r = 16 + brushBase;
    const g = inkCtx.createRadialGradient(0, 0, 0, 0, 0, r * 1.8);
    g.addColorStop(0, hsl(c.h, 90, 90, 0.95));
    g.addColorStop(0.3, hsl(c.h, 90, 65, 0.4));
    g.addColorStop(1, hsl(c.h, 90, 50, 0));

    inkCtx.strokeStyle = hsl(c.h, 80, 90, 0.8); inkCtx.lineWidth = 1.4;
    for (let i = 0; i < 8; i++) {

    inkCtx.restore();
    brighten(0.012);
  }

  // そっと消える（フリップ・長押し）。一瞬で消さず、ゆっくり夜に戻す
  // いまの絵を「残像」層へ移して ink は即座に空にし、残像の不透明度だけを下げる。
  // destination-out を毎フレーム重ねる方式は 8bit 丸めで α=13/255 が残り、α≦8 は永久に消えない。
  const ghost = document.createElement('canvas');
  const ghostCtx = ghost.getContext('2d');

  function softClear(via) {
    if (fading > 0 && ghost.width === ink.width && ghost.height === ink.height) {
      // 消している途中でもう一度：いまの残像の濃さを焼き込んでから、新しい絵を重ねる
      ghostCtx.save();

      ghostCtx.fillStyle = `rgba(0,0,0,${fading})`;
      ghostCtx.fillRect(0, 0, ghost.width, ghost.height);
      ghostCtx.restore();
    } else {
      ghost.width = ink.width; ghost.height = ink.height;   // 代入で中身は空になる
    }

    inkCtx.setTransform(1, 0, 0, 1, 0, 0);
    inkCtx.clearRect(0, 0, ink.width, ink.height);
    inkCtx.restore();
    fadeWarmth = warmth;
    fading = 1;
    say(`そっと けす${via ? '（' + via + '）' : ''}`);
  }

  // ── 描画ループ ──────────────────────────────────────────
  // 層の左上から画面ぶんだけを等倍で写す（拡大縮小しない・0サイズでも例外を出さない）
  function blit(src) {
    const sw = Math.min(src.width, Math.floor(W * DPR));
    const sh = Math.min(src.height, Math.floor(H * DPR));
    if (sw > 0 && sh > 0) ctx.drawImage(src, 0, 0, sw, sh, 0, 0, sw / DPR, sh / DPR);
  }
  // ── 背景の星めぐり：振る（または B キー）たびに、夜空 → 月面 → 火星 → 木星 → 土星 → 夜空 ──
  // どの星も、この作品のためにその場で描く（写真や画像ファイルは使わない）
  const SCENES = [
    { name: 'よぞら', say: 'おうちの そら' },
    { name: 'げつめん', say: 'げつめん だ！ ちきゅうが みえる' },
    { name: 'かせい', say: 'かせい だ！ あかい ほし' },
    { name: 'もくせい', say: 'もくせい だ！ おおきな しまもよう' },
    { name: 'どせい', say: 'どせい だ！ わっかが きれい' },
  ];
  const scene = { i: 0, from: 0, p: 1, changes: 0 };
  const nowFrame = () => performance.now();
  const sceneCache = new Map();                    // 背景は 1 回だけ細かく描いておき、毎フレームは貼るだけ
  function nextScene() {
    scene.from = scene.i; scene.i = (scene.i + 1) % SCENES.length; scene.p = 0; scene.changes++;
    say(SCENES[scene.i].name);
    if (mochiActive) speak(SCENES[scene.i].say, true);
  }
  function seeded(seed) {                           // 毎回同じ模様になる乱数
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function renderScene(idx) {
    const c = document.createElement('canvas'), d = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.max(1, Math.round(W * d)); c.height = Math.max(1, Math.round(H * d));
    const g = c.getContext('2d'); g.scale(d, d);
    const rnd = seeded(idx * 977 + 13), S = Math.min(W, H);
    const sky = (top, bot, stars) => {
      const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bot);
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      for (let i = 0; i < stars; i++) { const a = rnd(); g.fillStyle = `rgba(255,255,255,${0.15 + a * 0.7})`; g.beginPath(); g.arc(rnd() * W, rnd() * H * 0.8, a < 0.93 ? 0.6 + a * 0.6 : 1.6, 0, Math.PI * 2); g.fill(); }
    };

      sh.addColorStop(0, 'rgba(255,255,255,.08)'); sh.addColorStop(0.45, 'rgba(0,0,8,0)'); sh.addColorStop(1, `rgba(0,0,8,${night})`);

    };
    const limb = (cx, cy, R, a = 0.45) => {        // ふちほど暗く（球に見せる）
      const lg = g.createRadialGradient(cx, cy, R * 0.55, cx, cy, R);
      lg.addColorStop(0, 'rgba(0,0,8,0)'); lg.addColorStop(1, `rgba(0,0,8,${a})`);
      g.fillStyle = lg; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    };

      const rg = g.createRadialGradient(cx, cy, R * 0.96, cx, cy, R * 1.12);
      rg.addColorStop(0, color); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg; g.beginPath(); g.arc(cx, cy, R * 1.12, 0, Math.PI * 2); g.fill();
    };
    const clip = (cx, cy, R, fn) => { g.save(); g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip(); fn(); g.restore(); };

    if (idx === 1) {                                // 月面と、空に浮かぶ地球
      sky('#010208', '#0a0f22', 420);
      const ex = W * 0.78, ey = H * 0.22, ER = S * 0.1;
      rim(ex, ey, ER, 'rgba(120,190,255,.55)');
      const ocean = g.createRadialGradient(ex - ER * 0.35, ey - ER * 0.35, ER * 0.1, ex, ey, ER);
      ocean.addColorStop(0, '#5aa2f0'); ocean.addColorStop(1, '#0c3278');
      g.fillStyle = ocean; g.beginPath(); g.arc(ex, ey, ER, 0, Math.PI * 2); g.fill();
      clip(ex, ey, ER, () => {
        for (let i = 0; i < 9; i++) { g.fillStyle = i % 3 ? 'rgba(92,140,70,.85)' : 'rgba(170,140,90,.8)'; g.beginPath(); g.ellipse(ex + (rnd() - 0.5) * ER * 1.6, ey + (rnd() - 0.5) * ER * 1.4, ER * (0.12 + rnd() * 0.25), ER * (0.08 + rnd() * 0.18), rnd() * 3, 0, Math.PI * 2); g.fill(); }
        g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineCap = 'round';
        for (let i = 0; i < 14; i++) { g.lineWidth = ER * (0.03 + rnd() * 0.07); g.beginPath(); const y = ey + (rnd() - 0.5) * ER * 1.8; g.ellipse(ex + (rnd() - 0.5) * ER, y, ER * (0.3 + rnd() * 0.6), ER * 0.06, (rnd() - 0.5) * 0.4, rnd() * 3, rnd() * 3 + 2); g.stroke(); }
        g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.ellipse(ex, ey - ER * 0.95, ER * 0.5, ER * 0.14, 0, 0, Math.PI * 2); g.fill();
      });
      limb(ex, ey, ER, 0.4); shade(ex, ey, ER, 0.9);
      const hy = H * 0.72;                          // 月の地面（奥ほど暗く、手前ほど明るい）
      const gr = g.createLinearGradient(0, hy - 20, 0, H);
      gr.addColorStop(0, '#5d5e66'); gr.addColorStop(0.35, '#8e8f96'); gr.addColorStop(1, '#46474d');
      g.fillStyle = gr; g.beginPath(); g.moveTo(0, hy + 18);

    return Uint8Array.from(d);

  // 加速度：16bit リトルエンディアン、2の補数、1024 で G
  const accel = (lo, hi) => { const v = lo | (hi << 8); return (v >= 0x8000 ? v - 0x10000 : v) / 1024; };

  const KIND_NAME = { AC: '動き', BU: 'ボタン', PA: '明るさ', LE: 'LED', TH: '温度', MD: '人感', GP: 'GPIO' };
  const USED = ['AC', 'BU', 'PA'];              // この絵が使う3種だけ
  const blocks = new Map();                     // dev.id → ブロックごとの状態（接続をまたいで1つ）

  // 診断は明示したときだけ記録する。合成入力と BLE の notify / indicate を分ける。
  const debugEnabled = new URLSearchParams(location.search).get('debug') === '1';
  const DEBUG_LOG_LIMIT = 10000;
  const debugLog = [], debugCounts = {};
  const debugSources = new WeakMap();
  let debugSourceCount = 0, debugReceived = 0, debugDropped = 0, debugMismatch = 0, debugRenderPending = false;
  let debugPanel, debugBlocksEl, debugCountsEl, debugLogEl;
  const debugStartedAt = new Date().toISOString();
  const EVENT_LABELS = {
    tap: 'タップ', shake: 'シェイク', flip: 'フリップ', orientation: '向き',
    buttonSingle: 'ボタン1回', buttonLong: 'ボタン長押し', buttonDouble: 'ボタン2回',
    proximity: '明るさ', battery: '電池', powerOff: '電源オフ', firmware: '機能有効化応答', other: 'その他',
  };

  function meshEvent(d, kind) {
    if (d.length === 4 && d[0] === 0 && d[1] === 0) return 'battery';
    if (d.length === 4 && d[0] === 0 && d[1] === 1 && d[2] === 1) return 'powerOff';
    if (d.length === 16 && d[0] === 0 && d[1] === 2) return 'firmware';
    if (kind === 'AC' && d.length === 17 && d[0] === 1) return ['tap', 'shake', 'flip', 'orientation'][d[1]] || 'other';
    if (kind === 'BU' && d.length === 4 && d[0] === 1 && d[1] === 0) return ['other', 'buttonSingle', 'buttonLong', 'buttonDouble'][d[2]] || 'other';
    if (kind === 'PA' && d.length >= 13 && d[0] === 1 && d[1] === 0) return 'proximity';
    return 'other';
  }

  function debugBlockInfo(b) {
    return { block: b.debugName, kind: b.kind, status: b.status, firmware: b.firmware ?? null, batteryPercent: b.battery ?? null, lastError: b.lastError ?? null };
  }

  function debugSnapshot() {
    return {
      schemaVersion: 1, startedAt: debugStartedAt, exportedAt: new Date().toISOString(),
      sumStrict: SUM_STRICT, logLimit: DEBUG_LOG_LIMIT, received: debugReceived, dropped: debugDropped,
      rawChecksumMismatches: debugMismatch, meshStats: { ...meshStats },
      counts: Object.fromEntries(Object.keys(EVENT_LABELS).map(event => [event, debugCounts[event] || 0])),
      blocks: [...blocks.values()].map(debugBlockInfo), messages: sayLog.slice(),
      notifications: debugLog.map(entry => ({ ...entry, bytes: [...entry.bytes] })),
    };
  }

  function scheduleDebugRender() {
    if (!debugEnabled || debugRenderPending) return;
    debugRenderPending = true;
    requestAnimationFrame(() => { debugRenderPending = false; renderDebug(); });
  }

  function recordMesh(d, kind, st, block = null, channel = 'direct') {
    if (!debugEnabled) return;
    const key = block || st;
    let source = debugSources.get(key);
    if (!source) { source = { name: block ? block.debugName : `synthetic-${++debugSourceCount}`, lastShake: null }; debugSources.set(key, source); }
    const now = performance.now(), event = meshEvent(d, kind);
    const checksum = d.length < 2 ? 'unavailable' : sum8(Array.from(d).slice(0, -1)) === d[d.length - 1] ? 'match' : 'mismatch';
    const shakeIntervalMs = event === 'shake' && source.lastShake !== null ? Math.round((now - source.lastShake) * 1000) / 1000 : null;
    if (event === 'shake') source.lastShake = now;
    if (checksum === 'mismatch') debugMismatch++;
    debugCounts[event] = (debugCounts[event] || 0) + 1;
    debugLog.push({
      sequence: ++debugReceived, time: new Date().toISOString(), elapsedMs: Math.round(now * 1000) / 1000,
      source: source.name, channel, kind, event, length: d.length, bytes: Array.from(d),
      hex: Array.from(d, value => value.toString(16).padStart(2, '0').toUpperCase()).join(' '), checksum, shakeIntervalMs,
    });
    if (debugLog.length > DEBUG_LOG_LIMIT) { debugLog.shift(); debugDropped++; }
    scheduleDebugRender();
  }

  function renderDebug() {
    debugBlocksEl.textContent = ([...blocks.values()].map(b => `${b.debugName} ${KIND_NAME[b.kind]} / ${b.status} / FW ${b.firmware ?? '未受信'} / 電池 ${b.battery === undefined ? '未受信' : b.battery + '%'}${b.lastError ? `\n  最後のエラー: ${b.lastError}` : ''}`).join('\n') || '接続ブロックなし（direct は合成入力）') +
      `\n\n画面のメッセージ（新しい順）\n${sayLog.slice().reverse().join('\n') || 'なし'}`;
    debugCountsEl.textContent = Object.entries(EVENT_LABELS).map(([event, label]) => `${label}: ${debugCounts[event] || 0}`).join(' / ') +
      `\nmeshStats.sumMismatch: ${meshStats.sumMismatch} / 生データの不一致: ${debugMismatch}` +
      `\n明るさの手: 持ち上がり ${Math.round(handLift)} / 最大 ${Math.round(handPeak)} / 近いの線 ${Math.round(handLine())} / ためた量 ${Math.round(handCharge(performance.now()) * 100)}%` +
      `\n最後の手: ${lastGesture ? `${GESTURE_NAME[lastGesture.kind]} ${lastGesture.heldMs}ms / 離す ${lastGesture.releaseMs}ms（${lastGesture.fast ? 'パッ' : 'そっと'}）` : 'まだ'}` +
      `\n受信 ${debugReceived} 件 / 保存 ${debugLog.length} 件 / 保存上限で除外 ${debugDropped} 件`;
    debugLogEl.textContent = debugLog.slice(-20).reverse().map(entry =>
      `${entry.time.slice(11, 23)} ${entry.source} ${entry.kind}/${entry.channel} ${EVENT_LABELS[entry.event]} ${entry.length}B ${entry.checksum === 'match' ? 'SUM 一致' : entry.checksum === 'mismatch' ? 'SUM 不一致' : 'SUM 判定不可'}${entry.event === 'shake' ? ` / 前のシェイクから ${entry.shakeIntervalMs === null ? '初回' : entry.shakeIntervalMs + ' ms'}` : ''}\n${entry.hex}`
    ).join('\n\n') || 'まだ通知がない';
  }

  const sayLog = [];
  if (debugEnabled) {
    onSay = (msg) => {
      sayLog.push(`${new Date().toTimeString().slice(0, 8)} ${msg}`);
      if (sayLog.length > 12) sayLog.shift();
      scheduleDebugRender();
    };
    debugPanel = document.createElement('details'); debugPanel.id = 'debug-panel'; debugPanel.open = true;
    debugPanel.innerHTML = '<summary>MESH 診断（たたむ）</summary><p>受信数は動作の抑止前。振った回数は自動判定しない。同じ入力元のシェイク通知間隔を読む。</p><pre id="debug-blocks"></pre><pre id="debug-counts"></pre><button id="debug-copy" type="button">パネルをコピー</button> <button id="debug-export" type="button">ログを書き出す</button><p>表示は直近20件。JSONは直近10,000件と累計。受信のみ記録。ブラウザの機器名・IDは除く。生の基本情報にはシリアル番号を含む場合があるため、共有前に確認する。</p><pre id="debug-log"></pre>';
    document.body.appendChild(debugPanel);
    debugPanel.addEventListener('keydown', event => { if (!['KeyM', 'KeyG'].includes(event.code) && !['m', 'g'].includes(event.key)) event.stopPropagation(); });   // 消音の M とゲームの G は、パネルの上でも効かせる
    debugBlocksEl = document.getElementById('debug-blocks');
    debugCountsEl = document.getElementById('debug-counts');
    debugLogEl = document.getElementById('debug-log');
    document.getElementById('debug-copy').onclick = async () => {   // 実機の日に、見えている状態をそのまま貼れるように
      renderDebug();
      const text = [debugBlocksEl.textContent, debugCountsEl.textContent, debugLogEl.textContent].join('\n\n');
      try { await navigator.clipboard.writeText(text); say('診断をコピーした'); }
      catch (err) { say('コピーできなかった: ' + err.message); }
    };
    document.getElementById('debug-export').onclick = () => {
      const url = URL.createObjectURL(new Blob([JSON.stringify(debugSnapshot(), null, 2)], { type: 'application/json' }));
      const link = document.createElement('a'); link.href = url; link.download = 'irodori-mesh-log.json';
      link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    renderDebug();
  }

  function addChip(label) {
    const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = label;
    blocksEl.appendChild(c); return c;
  }
  // つながったブロックの遊び方を出し、その遊び方を1回できたら消す（説明しなくても触ればわかるように）
  const HINTS = { PA: '明るさ：手を近づけて もちを押す。ちょん・短く・長く・ぎゅっ・じっと で ちがう（「あそぶ」で ゲーム）', AC: '動き：転がすと 色、振ると 花火と 背景の星が かわる、伏せると 消える（ゲームでは 振ると 星が おちてくる・叩くと はねる）', BU: 'ボタン：押すと ロケット、2回で 次の色' };
  const usedKinds = new Set();
  const hintEl = document.getElementById('hint');
  const creditEl = document.getElementById('credit');
  function renderHint() {
    const kinds = [...new Set([...blocks.values()].filter((b) => b.status === 'on').map((b) => b.kind))]
      .filter((k) => !usedKinds.has(k) && !(k === 'PA' && mochiActive));   // もちが出ていれば、明るさの遊び方はもちが話す
    hintEl.textContent = kinds.map((k) => HINTS[k]).join('\n');
    hintEl.style.whiteSpace = 'pre-line';
    hintEl.hidden = kinds.length === 0;
  }
  function markUsed(kind) { if (!usedKinds.has(kind)) { usedKinds.add(kind); renderHint(); } }
  function paintChip(b, mark = '') {
    const name = KIND_NAME[b.kind];
    b.chip.textContent = `${name}${mark}${b.info ? ' ' + b.info : ''}`;
    b.chip.title = b.status === 'off' ? 'おすと つなぐ' : 'おすと はずす';
    renderHint();
    scheduleDebugRender();
  }
  const u8 = (v) => new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  // writeValueWithResponse は Chrome 85 から。無ければ writeValue（0004 は応答ありの書き込み口）
  const writeCmd = (c, bytes) => (c.writeValueWithResponse ? c.writeValueWithResponse(bytes) : c.writeValue(bytes));
  const withTimeout = (p, ms, what) => Promise.race([
    p, new Promise((_, rej) => setTimeout(() => rej(new Error(`${what}が${ms / 1000}秒こたえない`)), ms))
  ]);
  const newMeshState = () => ({ paBase: null, paAt: 0, lastShake: -1e9, lastTap: -1e9, lastFlip: -1e9, lastMove: -1e9, faceTimer: 0, tapTimer: 0 });
  const directState = newMeshState();            // window.irodori.onMesh から直接入れたとき用

  async function connectMesh() {
    if (!navigator.bluetooth) { say('この画面は Web Bluetooth 非対応。Chrome で start.sh から開く'); return; }
    let dev;
    try {
      say('ブロックをえらぶ…');
      // つないだブロックは選択肢から外し、2つ目以降を選びやすくする（exclusionFilters を知らない Chrome は無視する）
      const busy = [...blocks.values()].filter((b) => (b.status === 'on' || b.status === 'connecting') && b.dev.name).map((b) => ({ name: b.dev.name }));
      dev = await navigator.bluetooth.requestDevice({
        // filters は OR。'MESH-100' だと LED・温度・人感・GPIO まで並ぶ。services 単独だと名前の無い機器も並ぶ
        filters: USED.map((k) => ({ namePrefix: 'MESH-100' + k })),
        ...(busy.length ? { exclusionFilters: busy } : {}),
        optionalServices: [SVC]
      });
    } catch (err) {
      // ここでの NotFoundError は「選ばずに閉じた」だけ。接続後の NotFoundError とは分けて扱う
      if (err && err.name !== 'NotFoundError') say('えらべなかった: ' + err.message);
      return;
    }
    // 公式: Complete Local Name は「MESH-100」+種類2文字+シリアル7桁の17文字
    const kind = /^MESH-100[A-Z]{2}\d{7}$/.test(dev.name || '') ? dev.name.slice(8, 10) : '';
    if (!USED.includes(kind)) { say(`${dev.name || '名前のない機器'} は この絵では使わない`); return; }

    let b = blocks.get(dev.id);
    if (b && (b.status === 'on' || b.status === 'connecting')) {
      // Chrome は接続中のブロックも選択肢に出し、同じ device / characteristic を返す。二重に組まない
      say(`${KIND_NAME[kind]} は もう つながっている`);
      return;
    }
    if (!b) {
      b = { dev, kind, chip: addChip(KIND_NAME[kind]), info: '', status: 'off', tries: 0, timer: 0, state: newMeshState(), debugName: `${kind}-${blocks.size + 1}` };
      // 関数を1つに固定しておくと、同じ characteristic に何度 add しても1回しか登録されない
      b.onNtf = (e) => {
        const d = u8(e.target.value);
        if (d.length === 4 && d[0] === 0 && d[1] === 0) { recordMesh(d, b.kind, b.state, b, 'notify'); b.battery = d[2] * 10; b.info = `${b.battery}%`; paintChip(b); return; }   // 定時通信（約1分ごとの電池）
        if (d.length === 4 && d[0] === 0 && d[1] === 1 && d[2] === 1) { recordMesh(d, b.kind, b.state, b, 'notify'); b.bye = true; return; } // アイコン長押し＝電源オフ操作
        onMesh(d, b.kind, b.state, b);
      };
      b.onInd = (e) => {
        const d = u8(e.target.value);
        recordMesh(d, b.kind, b.state, b, 'indicate');
        if (d.length === 16 && d[0] === 0 && d[1] === 2) {
          const ok = d[7] > 1 || (d[7] === 1 && (d[8] > 2 || (d[8] === 2 && d[9] >= 5)));
          b.firmware = `${d[7]}.${d[8]}.${d[9]}`; b.battery = d[14] * 10;
          b.info = `${ok ? '' : '★要更新 '}${d[14] * 10}%`; paintChip(b);
          if (!ok) say(`ファーム ${d[7]}.${d[8]}.${d[9]}。スマホの MESH アプリで 1.2.5 以上に更新してから`);
        }
      };
      b.chip.onclick = () => toggleBlock(b);
      dev.addEventListener('gattserverdisconnected', () => onBlockLost(b));   // dev は同じオブジェクトが返るので1回だけ
      blocks.set(dev.id, b);
    }
    clearTimeout(b.timer); b.tries = 0;
    await bringUp(b);
  }

  // 右上のブロック名を押す：つながっている・つなぎ中・再接続待ちなら外す。外れていれば選ぶ画面を出さずにつなぎ直す
  function toggleBlock(b) {
    clearTimeout(b.timer);
    if (b.status === 'off') { b.tries = 0; bringUp(b); return; }
    b.released = true;
    b.status = 'off'; paintChip(b, ' ×');          // 先に off にすると、切断の通知で再接続しない
    if (b.kind === 'PA') resetHand();
    try { b.dev.gatt.disconnect(); } catch (_) { /* 切れていれば何もしない */ }
    say(`${KIND_NAME[b.kind]} を はずした（もう一度おすと つなぐ）`);
  }

  async function bringUp(b) {
    const name = KIND_NAME[b.kind];
    b.released = false;
    b.status = 'connecting'; paintChip(b, ' …');
    say(`${name} につないでいる…`);
    try {
      const gatt = await withTimeout(b.dev.gatt.connect(), 12000, '接続');
      const svc = await gatt.getPrimaryService(SVC);
      const ind = await svc.getCharacteristic(C_IND);
      const ntf = await svc.getCharacteristic(C_NTF);
      const wrt = await svc.getCharacteristic(C_WRT);
      ind.addEventListener('characteristicvaluechanged', b.onInd);
      ntf.addEventListener('characteristicvaluechanged', b.onNtf);
      await ind.startNotifications();
      await ntf.startNotifications();
      b.state = newMeshState();                   // 明るさの基準などは接続ごとに取り直す
      await writeCmd(wrt, FEATURE_ON);            // 機能有効化は接続のたびに要る
      if (b.kind === 'PA') {
        await new Promise((r) => setTimeout(r, 200));
        try { await writeCmd(wrt, paModeCmd(PA_MODE)); }
        catch (err) {                             // 組み合わせのモードが通らない機体なら、以前の 0x20 で続ける
          if (PA_MODE === 0x20) throw err;
          b.lastError = `モード 0x${PA_MODE.toString(16)} 失敗 ${err.name}: ${err.message}`;
          say(`${name} の設定を 0x20 にもどす`);
          await writeCmd(wrt, paModeCmd(0x20));
        }
      }
      if (b.released) { try { b.dev.gatt.disconnect(); } catch (_) { /* 外した後に接続が終わった */ } return; }
      if (b.kind === 'PA' && mochiParam !== '0') mochiActive = true;
      b.status = 'on'; b.tries = 0; paintChip(b);
      sound('click');
      say(`${name} つながった`);
    } catch (err) {
      if (b.released) return;                     // 本人が外した。つなぎ直さない
      b.lastError = `${(err && err.name) || 'Error'}: ${(err && err.message) || ''}`;
      // 途中で失敗したら必ず切る。つないだまま残すと、ブロックは他から使えず、次の選択で中途半端な状態を拾う
      try { b.dev.gatt.disconnect(); } catch (_) { /* 切れていれば何もしない */ }
      if (err && err.name === 'NotFoundError') {    // サービス／口が無い＝仕様違いの機器。何度やっても同じ
        b.status = 'off'; paintChip(b, ' ×');
        say(`${name} に MESH の口が見つからない（${err.message}）`);
        return;
      }
      scheduleRetry(b, err);
    }
  }

  function onBlockLost(b) {
    if (b.status !== 'on') return;                // 立ち上げ途中の切断は bringUp の catch が扱う
    if (b.kind === 'PA') resetHand();             // 手をかざしたまま切れても筆を戻す
    if (b.bye) {                                  // 本人が電源を切った。追いかけない
      b.bye = false; b.status = 'off'; paintChip(b, ' ×');
      say(`${KIND_NAME[b.kind]} の電源が切れた`);
      return;
    }
    scheduleRetry(b, null);
  }

  function scheduleRetry(b, err) {
    const name = KIND_NAME[b.kind];
    clearTimeout(b.timer);
    if (b.tries >= 8) {                           // 2+4+8+15×5＝89秒 試してだめなら止める（電源オフ・電池切れ）
      b.status = 'off'; paintChip(b, ' ×');
      say(`${name} がもどらない。電源を確かめて「MESHをつなぐ」から選びなおす`);
      return;
    }
    const wait = Math.min(15000, 2000 * 2 ** b.tries);
    b.tries++;
    b.status = 'retry'; paintChip(b, ' …');
    say(`${name} がはずれた。${wait / 1000}秒後につなぎなおす${err && err.message ? '（' + err.message + '）' : ''}`);
    b.timer = setTimeout(() => bringUp(b), wait);
  }

  function onMesh(d, kind, st = directState, block = null) {
    recordMesh(d, kind, st, block, block ? 'notify' : 'direct');
    const now = performance.now();
    // 動きブロック：17バイト [0x01, event, face, -, xL,xH, yL,yH, zL,zH, …, checksum]
    if (kind === 'AC') {
      if (d.length !== 17 || d[0] !== 0x01 || !sumOk(d)) return;   // 公式 MESH.js も 17 バイト固定
      const ev = d[1];
      const ax = accel(d[4], d[5]), ay = accel(d[6], d[7]);
      // 傾きの向きで、花火や星の咲く場所をずらす
      const px = W / 2 + Math.max(-1, Math.min(1, ax)) * W * 0.32;
      const py = H / 2 + Math.max(-1, Math.min(1, ay)) * H * 0.28;
      if (ev === 0x03) {                          // 上を向いた面（1〜6）＝ パレットの色
        const face = d[2];
        if (face < 1 || face > 6) return;
        st.lastMove = now; clearTimeout(st.tapTimer);
        // 転がしている途中の面・角で揺れた面は採らない。350ms 同じ面で落ち着いたら色にする
        clearTimeout(st.faceTimer);
        st.faceTimer = setTimeout(() => {
          if (performance.now() - st.lastFlip < 800) return;       // 裏返しに付いてきた向き変更は「消す」の一部
          setColor(face - 1, `${face}面`); markUsed('AC');
        }, 350);
      } else if (ev === 0x01) {                   // 振る ＝ 花火（振り続けても 0.6 秒に1発）
        st.lastMove = now; clearTimeout(st.tapTimer);
        if (now - st.lastShake < 600) return;
        st.lastShake = now;
        markUsed('AC');
        nextScene();                                 // 振るたびに、背景の星が変わる
        if (game.on) { gameShake(); return; }       // ゲーム中：振ると、空の星が もちに向かって落ちてくる
        if (mochiActive) mochi.v += 0.22;
        firework(px, py, PALETTE[colorIndex].h, true);
      } else if (ev === 0x00) {                   // 叩く ＝ 星
        // 公式のタップは「振動を感知したら通知」。振る・置く・裏返すの衝撃でも来る。星は絵に残るので、
        // 300ms 待って、その間や直前に動きの通知が無かったときだけ星にする（シェイク判定がタップより遅れて来ても拾える）
        if (now - st.lastMove < 400 || now - st.lastTap < 250) return;
        st.lastTap = now;
        clearTimeout(st.tapTimer);
        st.tapTimer = setTimeout(() => {
          if (performance.now() - st.lastMove < 300) return;
          if (game.on) { markUsed('AC'); gameRelease({ kind: 'tap', heldMs: 150, releaseMs: 0, fast: true }, 150); return; }   // ゲーム中：叩くと はねる（空中なら もう一段）
          star(px, py);
        }, 300);
      } else if (ev === 0x02) {                   // ひっくり返す ＝ そっと消える
        st.lastMove = now; clearTimeout(st.tapTimer);
        clearTimeout(st.faceTimer);
        if (now - st.lastFlip < 800) return;
        st.lastFlip = now;
        softClear('ひっくり返した'); markUsed('AC');
      }
      return;
    }
    // ボタン：[1, 0, 種別, checksum]  1=1回 2=長押し 3=2回
    if (kind === 'BU') {
      if (d.length !== 4 || d[0] !== 1 || d[1] !== 0 || !sumOk(d)) return;
      markUsed('BU');
      if (d[2] === 1) launchRocket();               // 1 回押し ＝ ロケット（上で花火になる）
      else if (d[2] === 3) setColor(colorIndex + 1, 'ボタン');
      else if (d[2] === 2) softClear('長押し');
      return;
    }
    // 明るさ：13バイト [1, 0, reqId, mode, proxL, proxH, luxL, luxH, -,-,-,-, checksum]（近接は 0〜4095、近いほど大）
    if (kind === 'PA') {
      if (d.length < 13 || d[0] !== 1 || d[1] !== 0 || !sumOk(d)) return;   // 和は常に最終バイト
      const prox = d[4] | (d[5] << 8);
      // 基準は「手が無いときの値」。下へは速く追い、上へはごく遅く追う（かざした手に基準が寄っていかない）
      // 通知の間隔は変化時の通知と 500ms の定時通知で揺れるので、回数ではなく経過時間で追う
      // （500ms 間隔のとき、下へ約 0.5・上へ約 0.005 ずつ寄る。以前の1通知あたりの係数と同じ）
      const dt = Math.min(2000, now - st.paAt);
      st.paAt = now;
      if (st.paBase === null) st.paBase = prox;
      else if (prox < st.paBase) st.paBase += (prox - st.paBase) * (1 - Math.exp(-dt / 700));
      else if (!handNearAt) st.paBase += (prox - st.paBase) * (1 - Math.exp(-dt / 100000));   // 手が近い間は上へ追わない（じっと止めても手が基準に溶けない）
      const lift = Math.max(0, prox - st.paBase - 20);   // 20 はゆらぎ分の遊び
      brushTarget = 7 + Math.min(34, lift / 12);
      handGesture(lift, now);
    }
  }

  // ── 入力：こえ（声を色に）──────────────────────────────
  let micState = 'off';          // 'off' | 'starting' | 'on'
  let micAC = null;
  const micBtn = document.getElementById('mic');
  async function toggleMic() {
    if (micState !== 'off') {    // 許可ダイアログ中の2回押しで getUserMedia・AudioContext・listen ループを二重に作らない
      if (micAC && micAC.state !== 'running') micAC.resume().catch(() => {});
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('この開き方ではマイクが使えない（localhost か https で開く）'); return;
    }
    micState = 'starting';
    micBtn.textContent = 'こえ …';
    // iOS Safari は「押した瞬間」に作った AudioContext しか動かない。await（許可ダイアログ）の前に作って起こす
    micAC = micAC || new (window.AudioContext || window.webkitAudioContext)();
    micAC.resume().catch(() => {});
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const an = micAC.createAnalyser(); an.fftSize = 512;
      micAC.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      micState = 'on';
      micBtn.textContent = 'こえ ON';
      let alive = true;
      const [track] = stream.getAudioTracks();
      if (track) track.addEventListener('ended', () => {   // マイクを抜いた・権限を切った → 押し直せる状態に戻す
        alive = false; micState = 'off'; micBtn.textContent = 'こえ';
        say('マイクが切れた。もう一度「こえ」を押す');
      });
      let nextBurst = 0;
      (function listen(t) {
        if (!alive) return;
        an.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
        const level = peak / 128;
        voiceGlow = Math.max(voiceGlow, Math.min(1, level * 1.6));
        if (level > 0.62 && t >= nextBurst) { firework(); nextBurst = t + 750; }   // フレーム数でなく時間で間引く
        requestAnimationFrame(listen);
      })(performance.now());
      say('こえで ひかる');
    } catch (err) {
      micState = 'off';
      micBtn.textContent = 'こえ';
      say(err && err.name === 'NotAllowedError'
        ? 'マイクが許可されていない。アドレスバーの左のアイコンで「許可」にして、もう一度'
        : 'マイクが使えなかった');
    }
  }
  // iPad のスリープ・通知音・他アプリで AudioContext は suspended/interrupted になり自動では戻らない。触ったら起こす
  window.addEventListener('pointerdown', () => {
    if (micAC && micAC.state !== 'running') micAC.resume().catch(() => {});
  }, { capture: true, passive: true });

  document.getElementById('mesh').onclick = connectMesh;
  document.getElementById('mic').onclick = toggleMic;
  document.getElementById('clear').onclick = () => softClear();
  document.getElementById('game').onclick = (e) => { toggleGame(); e.currentTarget.blur(); };
  document.getElementById('sound').onclick = (e) => { toggleMute(); e.currentTarget.blur(); };   // フォーカスを外し、スペースでためるときに押し直さない
  paintGameButton();

  // 外から出来事を入れる口（M5・RFID をあとで足すとき用）
  window.irodori = { firework, star, setColor, softClear, onMesh, meshStats, accel,
    getMotionState: () => ({ reducedMotion, sparkCount: sparks.length, warmth, displayedWarmth }),
    getGameState: () => ({ on: game.on, score: game.score, jumps: game.jumps, stars: game.stars.length, starYs: game.stars.map((st) => st.y), booms: game.booms, shakes: game.shakes, combo: game.combo, maxCombo: game.maxCombo, constellations: game.constellations, shootings: game.shootings, dawns: game.dawns, airborne: mochi.jy < -2, lastPredicted: game.lastPredicted, lastApex: game.lastApex, mochiX: mochi.x, mochiY: mochi.cy, ground: groundY() }),
    gameSpawn: (x, y, vx, shooting) => spawnStar(x, y, vx, shooting),
    getStrain: () => ({ strain: Boolean(mochi.strain), umu }),
    getIntro: () => ({ on: intro.on, phase: intro.phase }),
    getScene: () => ({ index: scene.i, name: SCENES[scene.i].name, changes: scene.changes }),
    nextScene: () => nextScene(),
    getRocketState: () => ({ flying: rockets.length, launched: rocketsLaunched }),
    launchRocket: () => launchRocket(),
    getTalkState: () => ({ step: talk.step, line: talk.line, shown: talk.shown, queued: talk.queue.length, lines: talk.lines }),
    jumpHeight: (ms) => jumpHeight(ms),
    getMochiState: () => ({ active: mochiActive, squash: mochi.s, flying: blobs.length, thrown: mochi.thrown, splats: mochi.splats, muted: audioMuted, sfxLoaded: Object.keys(sfx).length, sleeping, gestures: { ...mochi.gestures }, lastGesture: lastGesture && { ...lastGesture } }),
    getHandState: () => ({ lift: handLift, peak: handPeak, line: handLine(), near: handNearAt > 0, charge: handCharge(performance.now()), brushTarget }),
  };
  if (debugEnabled) window.irodori.debug = { snapshot: debugSnapshot };

  // 置きっぱなし展示：画面のスリープ（iPad の自動ロック・Mac のディスプレイスリープ）を止める。
  // タブを離れると自動で解除されるので、戻ってきたら取り直す。非対応・拒否なら何もしない。
  let wakeLock = null, wakePending = false;
  async function keepAwake() {
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || wakeLock || wakePending) return;
    wakePending = true;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (_) { /* 低電力モード等 */ }
    wakePending = false;
  }
  document.addEventListener('visibilitychange', keepAwake);
  window.addEventListener('pointerdown', keepAwake, { passive: true });   // Safari は操作後でないと取れないことがある
  keepAwake();

  // iPad（Safari/Chrome）は Web Bluetooth 非対応。押しても案内が2.6秒出るだけのボタンを子どもに見せない
  if (!navigator.bluetooth) document.getElementById('mesh').hidden = true;

  resize();
  setColor(colorIndex);
  say('ゆびで えがく');
  if (intro.on && !audioMuted) {                 // 触る前に声をデコードしておき、最初のタップで遅れずに鳴らす
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !audio) {
      try {
        audio = new AC();
        const comp = audio.createDynamicsCompressor(), master = audio.createGain();
        master.gain.value = 0.3; master.connect(comp); comp.connect(audio.destination); audio.master = master;
        loadSfx(audio);
      } catch (_) { audio = null; }
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
